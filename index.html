<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مژه چوسی | تخصصی‌ترین مرکز کسعشر</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;700&display=swap');
        
        body { font-family: 'Vazirmatn', sans-serif; margin: 0; background-color: #fff0f5; color: #4a4a4a; overflow-x: hidden; }
        
        /* انیمیشن اصلی ورود */
        .fade-in { animation: fadeIn 1.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        header { background: linear-gradient(135deg, #ffb7c5, #ff9aa2); color: white; padding: 4rem 1rem; text-align: center; clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%); }
        
        .btn { 
            display: inline-block; background: #d63384; color: white; padding: 15px 30px; 
            border-radius: 50px; text-decoration: none; font-weight: bold;
            transition: all 0.3s; animation: pulse 2s infinite;
        }
        .btn:hover { transform: scale(1.1); background: #b02a6c; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .card { 
            background: white; padding: 2rem; margin: 20px auto; width: 80%; max-width: 600px;
            border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: 0.4s;
        }
        .card:hover { transform: translateY(-10px); box-shadow: 0 20px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<header class="fade-in">
    <h1>مژه چوسی 🌸</h1>
    <p>مژه چوسی سیکتیر تقدیم میکند</p>
</header>

<div class="fade-in" style="margin-top: -50px;">
    <div class="card">
        <h2>خدمات ویژه</h2>
        <p>✓ اکستنش کسشر ارایش تخاماتیک</p>
        <p>✓ لیفت بیست شیشی</p>
    </div>

    <div class="card" style="text-align: center;">
        <h2>رزرو وقت مشاوره</h2>
        <a href="#" class="btn">تماس در و گوهستان📱</a>
    </div>
</div>

</body>
</html>
